name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "assets/**"
      - "chapters/**"
      - "exercises/**/README.md"
      - "exercises/**/assets/**"
      - "scripts/build_docs_site.py"
      - "scripts/check_site_links.py"
      - "scripts/validate_figure_content.py"
      - "tests/test_docs.py"
      - "tests/test_images.py"
      - "tests/test_im2col_figure.py"
      - "tests/test_site.py"
      - "tests/browser/**"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.js"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install documentation test dependencies
        run: python -m pip install pillow
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.159.1"
          extended: true
      - name: Prepare documentation
        run: python scripts/build_docs_site.py
      - name: Build site
        run: hugo --source site --minify
      - name: Build search index
        run: npx -y pagefind@1.5.2 --site site/public
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check reading interactions
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:site
      - name: Check documentation
        run: |
          python -m unittest tests.test_docs tests.test_site tests.test_images tests.test_im2col_figure -v
          python scripts/validate_figure_content.py
          python scripts/check_site_links.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
